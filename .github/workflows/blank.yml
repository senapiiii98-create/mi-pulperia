name: Compile APK Final
on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip clean project
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        unzip -o *.zip -d extracted_data || true
        # Si los archivos se extrajeron en una subcarpeta, los mueve a la raiz
        if [ -f "extracted_data/settings.gradle.kts" ]; then
          cp -r extracted_data/* . 2>/dev/null || true
          cp -r extracted_data/.[!.]* . 2>/dev/null || true
        fi

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Android Licenses Automatically
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo "24a33b3b76716ec83b8214b904d5102595450a31" > $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

    - name: Build APK smoothly
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: pulperia-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
