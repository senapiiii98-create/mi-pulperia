name: Compilar APK desde ZIP

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Descomprimir y Buscar Proyecto
      run: |
        unzip PulperiaLaNegrita_Android.zip -d extracted_project || unzip *.zip -d extracted_project
        
        # Buscar la ruta exacta donde se encuentra el archivo settings.gradle.kts
        TARGET_DIR=$(find extracted_project -name "settings.gradle.kts" -exec dirname {} \;)
        echo "Proyecto encontrado en: $TARGET_DIR"
        
        # Mover todo el contenido de esa carpeta a la raíz del servidor
        mv $TARGET_DIR/* . 2>/dev/null || true
        mv $TARGET_DIR/.[!.]* . 2>/dev/null || true

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Dar permisos a Gradle
      run: chmod +x gradlew || true

    - name: Compilar APK con Gradle
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Subir APK Generado
      uses: actions/upload-artifact@v4
      with:
        name: pulperia-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
