name: Compile Clean APK
on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip Clean Project Structure
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        unzip -o *.zip -d project_root || true
        cp -r project_root/PulperiaLaNegrita_Android/PulperiaLaNegrita_Android/* . 2>/dev/null || true
        cp -r project_root/PulperiaLaNegrita_Android/PulperiaLaNegrita_Android/.[!.]* . 2>/dev/null || true
        
        # Limpieza absoluta de archivos viejos
        rm -f build.gradle build.gradle.kts settings.gradle settings.gradle.kts
        rm -f app/build.gradle app/build.gradle.kts

    - name: Force Rewrite Universal Gradle Files
      run: |
        # Crear settings.gradle limpio
        cat << 'EOF' > settings.gradle
        rootProject.name = "PulperiaLaNegrita"
        include ':app'
        EOF

        # Crear build.gradle principal estable
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:8.2.2"
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # Crear app/build.gradle forzando compatibilidad total de todo el arbol de librerias
        mkdir -p app
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'org.jetbrains.kotlin.android'

        android {
            namespace "com.pulperialanegrita.app"
            compileSdk 34

            defaultConfig {
                applicationId "com.pulperialanegrita.app"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
                testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
                debug {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        configurations.all {
            resolutionStrategy {
                // Forzar versiones estables alineadas para romper el conflicto de la captura
                force 'androidx.transition:transition:1.4.1'
                force 'androidx.viewpager2:viewpager2:1.0.0'
                force 'com.google.android.material:material:1.10.0'
                force 'androidx.customview:customview-poolingcontainer:1.0.0'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.activity:activity-ktx:1.8.2'
            implementation 'com.google.android.material:material:1.10.0'
            implementation 'androidx.viewpager2:viewpager2:1.0.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.recyclerview:recyclerview:1.3.2'
            testImplementation 'junit:junit:4.13.2'
            androidTestImplementation 'androidx.test.ext:junit:1.1.5'
            androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
        }
        EOF

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.2 (Version de alta estabilidad)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'

    - name: Build Android APK
      run: |
        gradle clean assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: PulperiaLaNegrita-debug
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
