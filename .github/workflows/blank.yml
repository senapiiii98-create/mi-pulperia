name: Compilar APK Final de la Pulperia

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Extraer e instalar herramientas de descompresion
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip
        unzip -o *.zip

    - name: Acomodar archivos de la doble carpeta
      run: |
        # Este comando busca la carpeta interna real donde estan las configuraciones de gradle
        REAL_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
        echo "La ruta real del proyecto es: $REAL_DIR"
        
        # Movemos de forma forzada todo a la raiz del servidor para que compile bien
        cp -r $REAL_DIR/* . 2>/dev/null || true
        cp -r $REAL_DIR/.[!.]* . 2>/dev/null || true

    - name: Instalar el entorno Java oficial
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Forzar construccion e instalar Gradle nativo
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Subir el archivo APK listo para descargar
      uses: actions/upload-artifact@v4
      with:
        name: pulperia-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
