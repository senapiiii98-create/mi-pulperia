name: Compile Clean APK
on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip Clean Project Structure
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        unzip -o *.zip -d project_root || true
        cp -r project_root/PulperiaLaNegrita_Android/PulperiaLaNegrita_Android/* . 2>/dev/null || true
        cp -r project_root/PulperiaLaNegrita_Android/PulperiaLaNegrita_Android/.[!.]* . 2>/dev/null || true
        
        # Eliminar configuraciones viejas y archivos que puedan chocar
        find . -name "build.gradle" -delete
        find . -name "build.gradle.kts" -delete
        find . -name "settings.gradle" -delete
        find . -name "settings.gradle.kts" -delete
        find . -name "main.xml" -delete
        find . -name "AndroidManifest.xml" -delete

    - name: Force Rewrite Universal Gradle Files
      run: |
        # 1. Crear settings.gradle limpio
        cat << 'EOF' > settings.gradle
        rootProject.name = "PulperiaLaNegrita"
        include ':app'
        EOF

        # 2. Crear build.gradle principal estable
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:8.2.2"
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 3. Crear app/build.gradle interno con parches estables
        mkdir -p app
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'org.jetbrains.kotlin.android'

        android {
            namespace "com.pulperialanegrita.app"
            compileSdk 34

            defaultConfig {
                applicationId "com.pulperialanegrita.app"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
                testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
                debug {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        configurations.all {
            resolutionStrategy {
                force 'androidx.transition:transition:1.4.1'
                force 'androidx.viewpager2:viewpager2:1.0.0'
                force 'com.google.android.material:material:1.10.0'
                force 'androidx.customview:customview-poolingcontainer:1.0.0'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.activity:activity-ktx:1.8.2'
            implementation 'com.google.android.material:material:1.10.0'
            implementation 'androidx.viewpager2:viewpager2:1.0.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.recyclerview:recyclerview:1.3.2'
            implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
            
            testImplementation 'junit:junit:4.13.2'
            androidTestImplementation 'androidx.test.ext:junit:1.1.5'
            androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
        }
        EOF

    - name: Force Rewrite Layout and Style Files
      run: |
        # Crear la interfaz visual corregida
        mkdir -p app/src/main/res/layout
        cat << 'EOF' > app/src/main/res/layout/main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://android.com"
            android:orientation="vertical" android:padding="20dp"
            android:layout_width="match_parent" android:layout_height="match_parent">
            <TextView
                android:text="🛒 Pulpería La Negrita"
                android:textSize="26sp" android:textStyle="bold"
                android:textColor="#1769AA"
                android:layout_width="match_parent" android:layout_height="wrap_content"/>
            <TextView
                android:text="Sistema de ventas e inventario"
                android:textSize="15sp" android:paddingTop="4dp"
                android:layout_width="match_parent" android:layout_height="wrap_content"/>
            <android.widget.Space android:layout_width="match_parent" android:layout_height="24dp"/>
            <Button
                android:id="@+id/scan" android:text="📷 ESCANEAR CÓDIGO DE BARRAS"
                android:layout_width="match_parent" android:layout_height="60dp"/>
            <EditText
                android:id="@+id/code" android:hint="Código de barras"
                android:inputType="number"
                android:layout_width="match_parent" android:layout_height="wrap_content"/>
            <TextView
                android:id="@+id/status" android:text="Listo para escanear."
                android:textSize="15sp" android:paddingTop="16dp"
                android:layout_width="match_parent" android:layout_height="wrap_content"/>
            <android.widget.Space android:layout_width="match_parent" android:layout_height="20dp"/>
            <Button
                android:id="@+id/demo" android:text="Abrir sistema"
                android:layout_width="match_parent" android:layout_height="55dp"/>
            <TextView
                android:text="Versión 1.0 — lector de códigos integrado"
                android:gravity="center" android:paddingTop="30dp"
                android:layout_width="match_parent" android:layout_height="wrap_content"/>
        </LinearLayout>
        EOF

        # Crear el archivo de Temas/Estilos compatible con Material Design
        mkdir -p app/src/main/res/values
        cat << 'EOF' > app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.Pulperialanegrita" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="colorPrimary">#1769AA</item>
                <item name="colorSecondary">#00E5FF</item>
            </style>
        </resources>
        EOF

        # Crear el manifiesto oficial de Android amarrando todo el sistema limpio
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.CAMERA" />
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="Pulpería La Negrita"
                android:theme="@style/Theme.Pulperialanegrita">
                <activity
                    android:name="com.pulperialanegrita.app.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'

    - name: Build Android APK
      run: |
        gradle clean assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: PulperiaLaNegrita-debug
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
