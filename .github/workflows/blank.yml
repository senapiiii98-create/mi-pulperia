name: Compile APK Final
on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc

    - uses: actions/checkout@v4

    - name: Unzip project
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        unzip -o *.zip -d extracted_data
        REAL_PATH=$(find extracted_data -name "settings.gradle.kts" -o -name "settings.gradle" -exec dirname {} \; | head -n 1)
        cp -r $REAL_PATH/* . 2>/dev/null || true
        cp -r $REAL_PATH/.[!.]* . 2>/dev/null || true

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK without prompts
      run: |
        sudo apt-get update
        # Instalar gradle aceptando todo de golpe
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gradle
        # Aceptar licencias de Android automaticamente y compilar en modo silencioso
        yes | gradle assembleDebug --no-daemon --quiet
