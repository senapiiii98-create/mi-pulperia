name: Compilar APK desde ZIP

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Preparar y Descomprimir Proyecto
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        unzip -o *.zip -d extracted_project || unzip -o PulperiaLaNegrita_Android.zip -d extracted_project
        TARGET_DIR=$(find extracted_project -name "settings.gradle.kts" -o -name "settings.gradle" -exec dirname {} \; | head -n 1)
        echo "Proyecto localizado en: $TARGET_DIR"
        cp -r $TARGET_DIR/* . 2>/dev/null || true
        cp -r $TARGET_DIR/.[!.]* . 2>/dev/null || true

    - name: Configurar Entorno Java Correcto
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Validar y Ejecutar Compilacion
      run: |
        chmod +x gradlew || true
        ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon
