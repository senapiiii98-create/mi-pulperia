name: Compile Clean APK
on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip Clean Project Structure
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        # Descomprimir tanto el archivo nuevo como el anterior por si las carpetas de codigo se separaron
        unzip -o AndroidManifest.zip -d project_root || true
        unzip -o *.zip -d project_root || true
        
        # Buscar de forma profunda la ruta exacta donde se ubique el archivo settings.gradle.kts
        TARGET_PATH=$(find project_root -name "settings.gradle.kts" -o -name "settings.gradle" -exec dirname {} \; | head -n 1)
        echo "Source files found at: $TARGET_PATH"
        
        # Mover de forma forzada todas las dependencias encontradas a la raiz limpia del servidor
        cp -r $TARGET_PATH/* . 2>/dev/null || true
        cp -r $TARGET_PATH/.[!.]* . 2>/dev/null || true

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.9
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Build Android APK
      run: |
        gradle clean assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: PulperiaLaNegrita-debug
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
