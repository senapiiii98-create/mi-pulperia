name: Compilar APK desde ZIP

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Descomprimir Proyecto
      run: |
        unzip PulperiaLaNegrita_Android.zip
        if [ -d "PulperiaLaNegrita_Android" ]; then
          mv PulperiaLaNegrita_Android/* .
          mv PulperiaLaNegrita_Android/.[!.]* . 2>/dev/null || true
        fi

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Dar permisos a Gradle
      run: chmod +x gradlew || true

    - name: Compilar APK con Gradle
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Subir APK Generado
      uses: actions/upload-artifact@v4
      with:
        name: pulperia-apk
        path: app/build/outputs/apk/debug/app-debug.apk
