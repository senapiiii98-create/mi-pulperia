name: Compile APK Modern
on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip clean project
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        unzip -o *.zip -d extracted_data || true
        if [ -f "extracted_data/settings.gradle.kts" ]; then
          cp -r extracted_data/* . 2>/dev/null || true
          cp -r extracted_data/.[!.]* . 2>/dev/null || true
        fi

    - name: Setup Java 17 (Required)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.9 (Required)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Build Android APK
      run: |
        gradle clean assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: PulperiaLaNegrita-debug
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
