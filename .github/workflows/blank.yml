name: Compilar APK Final de la Pulperia

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar el codigo del repositorio
      uses: actions/checkout@v4

    - name: Instalar herramientas de descompresion
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip

    - name: Descomprimir y reestructurar proyecto
      run: |
        unzip -o *.zip -d extracted_data
        # Buscar en que subcarpeta real quedo el archivo settings.gradle.kts
        REAL_PATH=$(find extracted_data -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
        echo "El proyecto real esta en: $REAL_PATH"
        # Mover de forma forzada todos los archivos a la raiz para que Gradle trabaje sin perderse
        cp -r $REAL_PATH/* . 2>/dev/null || true
        cp -r $REAL_PATH/.[!.]* . 2>/dev/null || true

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Gradle nativo y Compilar APK
      run: |
        # Como tu proyecto no tiene gradlew, usamos el comando gradle directo del sistema
        sudo apt-get install -y gradle
        gradle assembleDebug --no-daemon --stacktrace

    - name: Guardar y empaquetar el APK resultante
      uses: actions/upload-artifact@v4
      with:
        name: pulperia-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
