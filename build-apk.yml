name: Compilar APK - Pulperia La Negrita
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle clean assembleDebug --no-daemon --stacktrace
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PulperiaLaNegrita-debug
          path: app/build/outputs/apk/debug/app-debug.apk
